---
# tasks file for portfolio
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Nginx web server
  apt:
    name: nginx
    state: present

- name: Ensure website destination directory exists
  file:
    path: "{{ web_destination_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy static website files
  copy:
    src: "{{ item }}"
    dest: "{{ web_destination_path }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - index.html
    - about.html
    - projects.html
    - contact.html
    - style.css

- name: Ensure Nginx service is started and enabled
  service:
    name: nginx
    state: started
    enabled: yes

